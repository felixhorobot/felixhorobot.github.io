<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Felix Ho · AI &amp; Automation Engineer</title>
<meta name="description" content="Felix Ho builds production machine learning systems: computer vision on the factory floor, LLM tools, and industrial automation. Portfolio and case studies.">
<meta property="og:title" content="Felix Ho · AI &amp; Automation Engineer">
<meta property="og:description" content="Production computer vision, LLM systems and industrial automation, from first idea to the factory floor.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230d1117'/><rect x='18' y='18' width='64' height='64' rx='6' fill='none' stroke='%2358e6b4' stroke-width='7'/><circle cx='50' cy='50' r='12' fill='%2358e6b4'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f14;
  --bg2:#10161d;
  --panel:#141b24;
  --line:#1f2a36;
  --text:#dce6f0;
  --muted:#8b9bab;
  --accent:#58e6b4;
  --accent2:#5ab8ff;
  --warn:#ffb454;
  --mono:'JetBrains Mono',Consolas,monospace;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;overflow-x:hidden}
::selection{background:rgba(88,230,180,.25)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%;display:block}

#content-error{background:#3a1520;color:#ffb4c0;padding:14px 20px;font-family:var(--mono);font-size:14px}

/* ---------- nav ---------- */
nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
  padding:14px 28px;background:rgba(11,15,20,.78);backdrop-filter:blur(12px);border-bottom:1px solid transparent;
  transition:border-color .3s}
nav.scrolled{border-bottom-color:var(--line)}
.nav-logo{font-family:var(--mono);font-weight:600;font-size:15px;color:var(--text)}
.nav-logo span{color:var(--accent)}
.nav-links{display:flex;gap:26px;font-size:14px}
.nav-links a{color:var(--muted);transition:color .2s}
.nav-links a:hover{color:var(--text);text-decoration:none}
@media(max-width:640px){.nav-links{display:none}}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100svh;display:flex;align-items:center;padding:96px 28px 48px}
#vision-canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.hero-inner{position:relative;max-width:1060px;margin:0 auto;width:100%}
.hero-tag{font-family:var(--mono);font-size:14px;color:var(--accent);margin-bottom:18px;letter-spacing:.04em}
.hero h1{font-size:clamp(38px,6.5vw,72px);font-weight:800;line-height:1.05;letter-spacing:-.02em}
.hero h1 .dim{color:var(--muted)}
.hero-sub{max-width:640px;margin-top:22px;font-size:clamp(16px,2vw,19px);color:var(--muted)}
.hero-sub b{color:var(--text);font-weight:600}
.hero-cta{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:8px;font-size:15px;font-weight:600;
  transition:transform .2s,box-shadow .2s;border:1px solid var(--line)}
.btn:hover{text-decoration:none;transform:translateY(-2px)}
.btn-primary{background:var(--accent);color:#04140d;border-color:var(--accent)}
.btn-primary:hover{box-shadow:0 8px 30px rgba(88,230,180,.25)}
.btn-ghost{color:var(--text)}
.btn-ghost:hover{border-color:var(--muted)}
.hero-stats{margin-top:64px;display:flex;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  background:rgba(16,22,29,.7);backdrop-filter:blur(6px);max-width:720px}
.stat{flex:1;padding:20px 12px;text-align:center;border-right:1px solid var(--line)}
.stat:last-child{border-right:none}
.stat .num{font-family:var(--mono);font-size:clamp(20px,3vw,30px);font-weight:600;color:var(--accent)}
.stat .lbl{font-size:12.5px;color:var(--muted);margin-top:4px}
@media(max-width:560px){.hero-stats{flex-direction:column}.stat{border-right:none;border-bottom:1px solid var(--line)}.stat:last-child{border-bottom:none}}

/* ---------- sections ---------- */
section{padding:96px 28px}
.wrap{max-width:1060px;margin:0 auto}
.sec-label{font-family:var(--mono);font-size:13px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
.sec-title{font-size:clamp(26px,4vw,40px);font-weight:800;margin-top:10px;letter-spacing:-.01em}
.sec-intro{color:var(--muted);max-width:640px;margin-top:14px}

/* reveal animation */
.reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s ease}
.reveal.visible{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none;transition:none}
  html{scroll-behavior:auto}
}

/* ---------- case studies ---------- */
.case{margin-top:56px;border:1px solid var(--line);border-radius:16px;background:var(--bg2);overflow:hidden}
.case-head{padding:30px 34px 0;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.case-num{font-family:var(--mono);color:var(--accent);font-size:15px}
.case h3{font-size:clamp(20px,2.6vw,27px);font-weight:700}
.case-body{display:grid;grid-template-columns:1.1fr .9fr;gap:34px;padding:20px 34px 34px}
@media(max-width:840px){.case-body{grid-template-columns:1fr}}
.case-text p{color:var(--muted);font-size:15.5px;margin-bottom:14px}
.case-text p b{color:var(--text);font-weight:600}
.case-text .result{border-left:3px solid var(--accent);padding:10px 16px;background:rgba(88,230,180,.06);
  border-radius:0 8px 8px 0;color:var(--text);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{font-family:var(--mono);font-size:12px;color:var(--accent2);border:1px solid rgba(90,184,255,.3);
  padding:4px 10px;border-radius:99px;background:rgba(90,184,255,.06)}
.case-visual{display:flex;align-items:center;justify-content:center;min-height:260px}
.case-visual img{border-radius:12px;border:1px solid var(--line)}

/* architecture diagram */
.arch{width:100%;font-family:var(--mono)}
.arch .box{fill:var(--panel);stroke:var(--line);rx:8}
.arch text{fill:var(--text);font-size:12px;font-family:var(--mono)}
.arch .sub{fill:var(--muted);font-size:10px}
.arch .flow{stroke:var(--accent);stroke-width:1.6;fill:none;stroke-dasharray:6 5;
  animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-11}}
@media(prefers-reduced-motion:reduce){.arch .flow{animation:none}}

/* latency chart */
.chart-frame{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.chart-title{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:8px}
#latency-path{stroke:var(--accent);stroke-width:2.5;fill:none}
#latency-area{fill:url(#latgrad);opacity:.25}
.chart-label{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.chart-label.hot{fill:var(--warn)}
.chart-label.good{fill:var(--accent)}

/* terminal */
.term{width:100%;background:#0a0d12;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-family:var(--mono);font-size:13px}
.term-bar{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.term-bar i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.term-bar i:first-child{background:#ff6b6b}.term-bar i:nth-child(2){background:var(--warn)}.term-bar i:nth-child(3){background:var(--accent)}
.term-body{padding:16px 18px;line-height:1.85;color:var(--muted)}
.term-body .cmd{color:var(--text)}
.term-body .cmd::before{content:'> ';color:var(--accent)}
.term-body .ok{color:var(--accent)}
.term-body .warn{color:var(--warn)}

/* ---------- projects ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;margin-top:48px}
.card{border:1px solid var(--line);border-radius:14px;background:var(--bg2);padding:26px;display:flex;flex-direction:column;
  transition:transform .25s,border-color .25s,box-shadow .25s}
#projects .card{background:var(--bg)}
.card:hover{transform:translateY(-5px);border-color:rgba(88,230,180,.4);box-shadow:0 14px 40px rgba(0,0,0,.35)}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.card h3{font-size:19px;font-weight:700}
.card h3 a{color:inherit}
.card h3 a:hover{color:var(--accent);text-decoration:none}
.badge{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:99px;white-space:nowrap}
.badge.live{color:var(--accent);border:1px solid rgba(88,230,180,.4);background:rgba(88,230,180,.08)}
.badge.beta{color:var(--warn);border:1px solid rgba(255,180,84,.4);background:rgba(255,180,84,.08)}
.card p{color:var(--muted);font-size:14.5px;flex:1}
.card p b{color:var(--text);font-weight:600}
.card .tag-note{font-family:var(--mono);font-size:12px;color:var(--accent2);margin-top:14px}
.card-media{margin:-26px -26px 18px;height:150px;border-bottom:1px solid var(--line);border-radius:14px 14px 0 0;
  overflow:hidden;position:relative;background:linear-gradient(135deg,#101820,#0d141b)}
.card-media svg{width:100%;height:100%}
.card-media img{width:100%;height:100%;object-fit:cover}

/* ---------- skills ---------- */
.skill-groups{margin-top:44px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
.skill-group{border:1px solid var(--line);border-radius:14px;padding:24px;background:var(--bg2)}
.skill-group h4{font-family:var(--mono);font-size:13px;color:var(--accent);letter-spacing:.05em;text-transform:uppercase;margin-bottom:14px}
.skill-group .chips{margin-top:0}
.skill-group .chip{color:var(--text);border-color:var(--line);background:var(--panel)}

/* ---------- about ---------- */
.about-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:44px;margin-top:44px}
@media(max-width:800px){.about-grid{grid-template-columns:1fr}}
.about-text p{color:var(--muted);margin-bottom:16px;font-size:16px}
.about-text p b{color:var(--text);font-weight:600}
.edu{border:1px solid var(--line);border-radius:14px;background:var(--bg2);padding:26px}
.edu h4{font-family:var(--mono);font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin-bottom:16px}
.edu-item{padding:12px 0;border-bottom:1px solid var(--line)}
.edu-item:last-child{border-bottom:none}
.edu-item .t{font-weight:600;font-size:15px}
.edu-item .s{color:var(--muted);font-size:13.5px;margin-top:2px}

/* ---------- contact ---------- */
.contact{text-align:center;padding-bottom:60px}
.contact .sec-title{margin-top:10px}
.contact .sec-intro{margin-left:auto;margin-right:auto}
.contact-links{margin-top:34px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
footer{border-top:1px solid var(--line);padding:26px;text-align:center;color:var(--muted);font-size:13px;font-family:var(--mono)}
</style>
</head>

<header class="hero">

<section id="work">
  <div class="wrap">

</section>

<section id="projects" style="background:var(--bg2)">
  <div class="wrap">

  </div>
</section>

<section id="skills">
  <div class="wrap">
    <div class="reveal" id="skill-intro"></div>
    <div class="skill-groups" id="skill-groups"></div>
  </div>
</section>

<section id="about" style="background:var(--bg2)">
  <div class="wrap">

(function () {
  const S = window.SITE;
  if (!S) { document.getElementById('content-error').hidden = false; return; }

  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  const el = (tag, cls, html) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  };

  /* a visual: "builtin:name" clones a template, anything else is an image path */
  function visualNode(v) {
    if (!v) return null;
    if (v.indexOf('builtin:') === 0) {
      const t = document.getElementById('tpl-' + v.slice(8));
      return t ? t.content.cloneNode(true) : null;
    }
    const img = document.createElement('img');
    img.src = v; img.alt = '';
    return img;
  }

  /* ---------- hero ---------- */
  document.getElementById('hero-tag').textContent = S.hero.tag;
  document.getElementById('hero-title').innerHTML =
    esc(S.hero.titleLine1) + '<br><span class="dim">' + esc(S.hero.titleLine2) + '</span>';
  document.getElementById('hero-sub').innerHTML = md(S.hero.intro);

  const cta = document.getElementById('hero-cta');
  (S.hero.buttons || []).forEach(b => {
    const a = el('a', 'btn ' + (b.style === 'primary' ? 'btn-primary' : 'btn-ghost'), esc(b.text));
    a.href = b.link;
    cta.appendChild(a);
  });

  const stats = document.getElementById('hero-stats');
  (S.hero.stats || []).forEach(st => {
    const d = el('div', 'stat');
    const num = el('div', 'num');
    if (/^\d+$/.test(st.value)) {
      num.innerHTML = '<span data-count="' + st.value + '">0</span>' + (st.unit ? ' ' + esc(st.unit) : '');
    } else {
      num.textContent = st.value + (st.unit ? ' ' + st.unit : '');
    }
    d.appendChild(num);
    d.appendChild(el('div', 'lbl', esc(st.label)));
    stats.appendChild(d);
  });

  /* ---------- section intros ---------- */
  function intro(id, data) {
    const box = document.getElementById(id);
    box.appendChild(el('div', 'sec-label', esc(data.label)));
    box.appendChild(el('h2', 'sec-title', md(data.title)));
    if (data.text) box.appendChild(el('p', 'sec-intro', md(data.text)));
  }
  intro('case-intro', S.caseIntro);
  intro('project-intro', S.projectIntro);
  intro('skill-intro', S.skillIntro);

  /* ---------- case studies ---------- */
  const list = document.getElementById('case-list');
  (S.caseStudies || []).forEach(c => {
    const art = el('article', 'case reveal');
    const head = el('div', 'case-head');
    head.appendChild(el('span', 'case-num', esc(c.number)));
    head.appendChild(el('h3', null, esc(c.title)));
    art.appendChild(head);

    const body = el('div', 'case-body');
    const text = el('div', 'case-text');
    (c.paragraphs || []).forEach(p => text.appendChild(el('p', null, md(p))));
    if (c.result) text.appendChild(el('div', 'result', md(c.result)));
    if (c.chips && c.chips.length) {
      const ch = el('div', 'chips');
      c.chips.forEach(x => ch.appendChild(el('span', 'chip', esc(x))));
      text.appendChild(ch);
    }
    body.appendChild(text);

    const vis = el('div', 'case-visual');
    const node = visualNode(c.visual);
    if (node) vis.appendChild(node);
    body.appendChild(vis);

    art.appendChild(body);
    list.appendChild(art);
  });

  /* ---------- projects ---------- */
  const grid = document.getElementById('project-grid');
  (S.projects || []).forEach(p => {
    const card = el('div', 'card reveal');
    const media = visualNode(p.image);
    if (media) {
      const m = el('div', 'card-media');
      m.appendChild(media);
      card.appendChild(m);
    }
    const top = el('div', 'card-top');
    const h = el('h3');
    if (p.link) {
      const a = el('a', null, esc(p.name));
      a.href = p.link; a.target = '_blank'; a.rel = 'noopener';
      h.appendChild(a);
    } else h.textContent = p.name;
    top.appendChild(h);
    if (p.badge) top.appendChild(el('span', 'badge ' + (p.badgeColor === 'orange' ? 'beta' : 'live'), esc(p.badge)));
    card.appendChild(top);
    card.appendChild(el('p', null, md(p.text)));
    if (p.tags) card.appendChild(el('div', 'tag-note', esc(p.tags)));
    grid.appendChild(card);
  });

  /* ---------- skills ---------- */
  const sg = document.getElementById('skill-groups');
  (S.skills || []).forEach(g => {
    const box = el('div', 'skill-group reveal');
    box.appendChild(el('h4', null, esc(g.group)));
    const ch = el('div', 'chips');
    (g.items || []).forEach(x => ch.appendChild(el('span', 'chip', esc(x))));
    box.appendChild(ch);
    sg.appendChild(box);
  });

  /* ---------- about ---------- */
  const ah = document.getElementById('about-head');
  ah.appendChild(el('div', 'sec-label', esc(S.about.label)));
  ah.appendChild(el('h2', 'sec-title', md(S.about.title)));
  const at = document.getElementById('about-text');
  (S.about.paragraphs || []).forEach(p => at.appendChild(el('p', null, md(p))));
  const ae = document.getElementById('about-edu');
  ae.appendChild(el('h4', null, esc(S.about.educationTitle)));
  (S.about.education || []).forEach(e2 => {
    const it = el('div', 'edu-item');
    it.appendChild(el('div', 't', esc(e2.title)));
    if (e2.sub) it.appendChild(el('div', 's', esc(e2.sub)));
    ae.appendChild(it);
  });

  /* ---------- contact + footer ---------- */
  const cw = document.getElementById('contact-wrap');
  cw.appendChild(el('div', 'sec-label', esc(S.contact.label)));
  cw.appendChild(el('h2', 'sec-title', md(S.contact.title)));
  cw.appendChild(el('p', 'sec-intro', md(S.contact.text)));
  const cl = el('div', 'contact-links');
  const mail = el('a', 'btn btn-primary', esc(S.contact.email));
  mail.href = 'mailto:' + S.contact.email;
  cl.appendChild(mail);
  (S.contact.links || []).forEach(l => {
    const a = el('a', 'btn btn-ghost', esc(l.text));
    a.href = l.link;
    cl.appendChild(a);
  });
  cw.appendChild(cl);
  document.getElementById('footer-el').textContent = S.footer || '';

  /* ============================================================
     Effects: scroll reveal, nav border, counters, hero canvas
     ============================================================ */
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); }
  }), { threshold: 0.12 });
  document.querySelectorAll('.reveal').forEach(x => io.observe(x));

  const nav = document.getElementById('nav');
  addEventListener('scroll', () => nav.classList.toggle('scrolled', scrollY > 30), { passive: true });

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cio = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    cio.unobserve(e.target);
    const t2 = e.target, target = +t2.dataset.count;
    if (reduced) { t2.textContent = target; return; }
    const t0 = performance.now(), dur = 1200;
    (function tick(t) {
      const p = Math.min((t - t0) / dur, 1);
      t2.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(tick);
    })(t0);
  }), { threshold: 0.6 });
  document.querySelectorAll('[data-count]').forEach(x => cio.observe(x));

  const cv = document.getElementById('vision-canvas');
  if (cv && !reduced) {
    const ctx = cv.getContext('2d');
    let W, H, targets = [];
    const LABELS = ['board 0.97', 'pack 0.94', 'board 0.91', 'stack 0.96', 'board 0.89', 'grade_A 0.93'];

    function resize() {
      W = cv.width = cv.offsetWidth * devicePixelRatio;
      H = cv.height = cv.offsetHeight * devicePixelRatio;
    }
    resize(); addEventListener('resize', resize);

    function spawn() {
      const w = (60 + Math.random() * 120) * devicePixelRatio;
      return {
        x: -w, y: H * (0.15 + Math.random() * 0.7),
        w, h: (26 + Math.random() * 40) * devicePixelRatio,
        v: (0.4 + Math.random() * 0.8) * devicePixelRatio,
        label: LABELS[Math.floor(Math.random() * LABELS.length)],
        lock: 0
      };
    }
    for (let i = 0; i < 6; i++) { const t = spawn(); t.x = Math.random() * W; targets.push(t); }

    function drawBox(t) {
      const a = 0.15 + 0.45 * t.lock;
      ctx.strokeStyle = 'rgba(88,230,180,' + a + ')';
      ctx.lineWidth = 1.2 * devicePixelRatio;
      const c = 9 * devicePixelRatio, x = t.x, y = t.y, w = t.w, h = t.h;
      ctx.beginPath();
      [[x, y + c, x, y, x + c, y], [x + w - c, y, x + w, y, x + w, y + c],
       [x + w, y + h - c, x + w, y + h, x + w - c, y + h], [x + c, y + h, x, y + h, x, y + h - c]]
        .forEach(seg => { ctx.moveTo(seg[0], seg[1]); ctx.lineTo(seg[2], seg[3]); ctx.lineTo(seg[4], seg[5]); });
      ctx.stroke();
      if (t.lock > 0.6) {
        ctx.fillStyle = 'rgba(88,230,180,' + a + ')';
        ctx.font = (11 * devicePixelRatio) + "px 'JetBrains Mono',monospace";
        ctx.fillText(t.label, x, y - 6 * devicePixelRatio);
      }
    }

    let scan = 0;
    function frame() {
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(31,42,54,.5)'; ctx.lineWidth = 1;
      const g = 64 * devicePixelRatio;
      for (let x = 0; x < W; x += g) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (let y = 0; y < H; y += g) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
      scan = (scan + 1.2 * devicePixelRatio) % (W + 200);
      const grad = ctx.createLinearGradient(scan - 100, 0, scan, 0);
      grad.addColorStop(0, 'rgba(88,230,180,0)'); grad.addColorStop(1, 'rgba(88,230,180,.06)');
      ctx.fillStyle = grad; ctx.fillRect(scan - 100, 0, 100, H);
      targets.forEach((t, i) => {
        t.x += t.v;
        t.lock = Math.min(1, t.lock + 0.01);
        if (t.x > W) targets[i] = spawn();
        drawBox(t);
      });
      if (!document.hidden) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) requestAnimationFrame(frame); });
  }
})();
</script>
</body>
</html>
